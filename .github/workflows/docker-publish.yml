name: Build and Push Docker Images

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  USERNAME: klages
  WEB_IMAGE: klages/ammotracker-web
  WORKER_IMAGE: klages/ammotracker-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha_short }}

      - name: Build and push Worker Image
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.vars.outputs.sha_short }}

      - name: Update docker-compose.yml with new tags
        run: |
          sed -i -E "s|image: ghcr.io/klages/ammotracker-web:.*|image: ghcr.io/klages/ammotracker-web:${{ steps.vars.outputs.sha_short }}|g" docker-compose.yml
          sed -i -E "s|image: ghcr.io/klages/ammotracker-worker:.*|image: ghcr.io/klages/ammotracker-worker:${{ steps.vars.outputs.sha_short }}|g" docker-compose.yml

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docker-compose.yml
          git commit -m "chore: update image tags to ${{ steps.vars.outputs.sha_short }} [skip ci]" || echo "No changes to commit"
          git push
